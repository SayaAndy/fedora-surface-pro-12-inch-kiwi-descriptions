# Surface Pro 12" (Snapdragon X1P-42-100)
#
# Include the ADSP/CDSP remoteproc driver in the initramfs.
# 
# Loading qcom_q6v5_pas triggers reinitialization of the USB hubs.
# If the driver loads after the root filesystem has been mounted,
# this can cause an externally connected boot drive to disconnect
# and reconnect, preventing the system from completing boot.
#
# Including the driver in the initramfs ensures it is loaded before
# the root filesystem is mounted, avoiding this issue.
#
# This also removes the need for rd.live.ram=1 when booting the
# live ISO, as the ISO can also be booted from an external drive
# and is therefore affected by the same USB reinitialization issue.

add_drivers+=" qcom_q6v5_pas "
