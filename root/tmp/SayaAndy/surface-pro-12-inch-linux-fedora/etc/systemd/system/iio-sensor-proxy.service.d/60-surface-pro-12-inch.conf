# Surface Pro 12" (Snapdragon X1P-42-100)
#
# The sensors on this device are not IIO devices. They live behind the SLPI
# DSP, reached over fastrpc by hexagonrpcd, and iio-sensor-proxy only sees them
# through the SSC backend it is built with here (-Dssc-support=enabled). So it
# has to start after that daemon, and stop being useful if the daemon dies.
#
# A drop-in rather than a replacement unit: upstream's own unit is D-Bus
# activated (Type=dbus, BusName=net.hadess.SensorProxy), which is how anything
# asking for net.hadess.SensorProxy gets the service started, and overriding it
# wholesale traded that away for nothing but this ordering.
[Unit]
Requires=hexagonrpc.service
After=hexagonrpc.service
